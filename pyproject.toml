[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wonca-rag"
version = "0.1.0"
description = "Temporal multi-model RAG pipeline for integrative review article screening."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "tqdm>=4.66",
    "tenacity>=8.2",
    "rich>=13.7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
